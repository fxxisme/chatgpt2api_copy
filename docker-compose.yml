services:
  app:
    image: ghcr.io/fxxisme/chatgpt2api_copy:latest
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      # 存储后端配置 (可选值: json, sqlite, postgres, git)
       - STORAGE_BACKEND=json
      
      # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
      # - DATABASE_URL=postgresql://user:password@host:5432/dbname
      # - DATABASE_URL=sqlite:///app/data/accounts.db
      
      # Git 仓库配置 (当 STORAGE_BACKEND=git 时使用)
      # - GIT_REPO_URL=https://github.com/user/repo.git
      # - GIT_TOKEN=ghp_xxxxxxxxxxxx
      # - GIT_BRANCH=main
      # - GIT_FILE_PATH=accounts.json
      
      # 认证密钥 (可选，覆盖 config.json)
      # - CHATGPT2API_AUTH_KEY=your_secret_key
      
      # 基础 URL (可选)
      # - CHATGPT2API_BASE_URL=https://your-domain.com

      # 可选：sentinel 浏览器求解服务（默认关闭，使用内置轻量 Python 求解；极高风控时参考 docs/sentinel-solver.md 启用）
      # - CHATGPT2API_SENTINEL_SOLVER_URL=http://sentinel-solver:8080
      # - CHATGPT2API_SENTINEL_SOLVER_KEY=change-me
    # depends_on:
    #   - sentinel-solver

  # 可选：无头 Chromium 求解服务（默认关闭；需要启用时取消注释，详细说明见 docs/sentinel-solver.md）
  # sentinel-solver:
  #   image: ghcr.io/fxxisme/chatgpt2api_copy-sentinel-solver:latest
  #   container_name: chatgpt2api-sentinel-solver
  #   restart: unless-stopped
  #   shm_size: "1gb"
  #   environment:
  #     - SENTINEL_SOLVER_KEY=change-me
  #     # 浏览器出网代理，需与主服务出口一致；服务器直连则留空
  #     # - SENTINEL_SOLVER_PROXY=http://host:7890
  #     # 页面时区，建议与出口 IP 所在地一致
  #     # - SENTINEL_SOLVER_TIMEZONE=Asia/Shanghai
